    this._onScroll = () => this.setState({ scrolled: window.scrollY > 260 });
    window.addEventListener('scroll', this._onScroll, { passive: true });
    this._onResize = () => this.setState({ isMobile: window.innerWidth < 1180 });
    this._onResize();
    window.addEventListener('resize', this._onResize);
  }

  componentWillUnmount() {
    window.removeEventListener('scroll', this._onScroll);
    window.removeEventListener('resize', this._onResize);
  }

  openMenu(i) {
    this.setState({ openIndex: i, flyoutKey: null });
    const anchor = this.liRefs[i];
    if (anchor) {
      const r = anchor.getBoundingClientRect();
      this.computeDropdownPos(i, r, 280);
    }
  }
  computeDropdownPos(i, anchorRect, panelWidth) {
    const anchorCenterX = anchorRect.left + anchorRect.width / 2;
    const vw = window.innerWidth;
    let left = anchorCenterX - panelWidth / 2;
    left = Math.max(8, Math.min(left, vw - panelWidth - 8));
    let arrowLeft = anchorCenterX - left - 6;
    arrowLeft = Math.max(12, Math.min(arrowLeft, panelWidth - 24));
    const top = Math.round(anchorRect.bottom);
    this.setState(s => ({ dropdownMeta: { ...s.dropdownMeta, [i]: { top, left, arrowLeft } } }));
  }
  measureDropdown(i, panelEl) {
    const anchor = this.liRefs[i];
    if (!anchor || !panelEl) return;
    const anchorRect = anchor.getBoundingClientRect();
    const panelRect = panelEl.getBoundingClientRect();
    this.computeDropdownPos(i, anchorRect, panelRect.width);
  }
  openFlyout(key) {
    this.setState({ flyoutKey: key });
    const anchor = this.childRefs[key];
    if (anchor) {
      const r = anchor.getBoundingClientRect();
      this.computeFlyoutPos(key, r, 260);
    }
  }
  computeFlyoutPos(key, anchorRect, panelWidth) {
    const vw = window.innerWidth;
    let left = anchorRect.right;
    let flipped = false;
    if (left + panelWidth > vw - 8) { left = Math.max(8, anchorRect.left - panelWidth); flipped = true; }
    const top = Math.round(anchorRect.top);
    this.setState(s => ({ flyoutMeta: { ...s.flyoutMeta, [key]: { top, left, flipped } } }));
  }
  measureFlyout(key, panelEl) {
    const anchor = this.childRefs[key];
    if (!anchor || !panelEl) return;
    const anchorRect = anchor.getBoundingClientRect();
    const panelRect = panelEl.getBoundingClientRect();
    this.computeFlyoutPos(key, anchorRect, panelRect.width);
  }
  closeMenu() { this.setState({ openIndex: null }); }

      ]},
      { label: 'Shades', href: 'Shades.dc.html', children: [
        { label: 'Awning Shade', href: 'Awning Shades.dc.html' },
        { label: 'Swimming Pool Shades', href: 'Swimming Pool Shades.dc.html' },
        { label: 'Pergola Shades', href: 'Pergola Shades.dc.html' },
        { label: 'Umbrella Shades', href: 'Umbrella Shades.dc.html' },
        { label: 'Tensile Shades', href: 'Tensile Shades.dc.html' },
      ]},
      { label: 'Contact', href: 'Contact.dc.html' },
    ];
  }

  renderVals() {
    const raw = this.getMenuData();
    const menu = raw.map((item, i) => ({
      ...item,
      i,
      hasChildren: !!item.children,
      isOpen: this.state.openIndex === i,
      mobileOpen: this.state.mobileOpenIndex === i,
      mobileToggleLabel: this.state.mobileOpenIndex === i ? '\u2212' : '+',
      openThis: () => this.openMenu(i),
      toggleThis: () => this.toggleMobileItem(i),
      liRef: (el) => { if (el) this.liRefs[i] = el; },
      panelRef: (el) => { if (el) requestAnimationFrame(() => this.measureDropdown(i, el)); },
      dropdownTop: this.state.dropdownMeta[i]?.top ?? 140,
      dropdownLeft: this.state.dropdownMeta[i]?.left ?? 100,
      arrowLeft: this.state.dropdownMeta[i]?.arrowLeft ?? 130,
      children: (item.children || []).map((c, ci) => ({
        ...c,
        hasChildren: !!c.children,
        flyoutOpen: this.state.flyoutKey === `${i}-${ci}`,
        hasChildrenNotFlipped: !!c.children && !(this.state.flyoutMeta[`${i}-${ci}`]?.flipped),
        flyoutFlipped: !!c.children && !!(this.state.flyoutMeta[`${i}-${ci}`]?.flipped),
        openFlyout: () => this.openFlyout(`${i}-${ci}`),
        flyoutRef: (el) => { if (el) requestAnimationFrame(() => this.measureFlyout(`${i}-${ci}`, el)); },
        childRef: (el) => { if (el) this.childRefs[`${i}-${ci}`] = el; },
        flyoutTop: this.state.flyoutMeta[`${i}-${ci}`]?.top ?? 140,
        flyoutLeft: this.state.flyoutMeta[`${i}-${ci}`]?.left ?? 400,
      })),
    }));

    return {
      menu,
      mobileOpen: this.state.mobileOpen,
      isMobile: this.state.isMobile,
      isDesktop: !this.state.isMobile,
      stickyStyle: `position:fixed;left:0;right:0;top:0;z-index:50;background:#BEA16A;transition:transform .3s;transform:translateY(${this.state.scrolled ? '0' : '-100%'});`,
      closeMenu: () => this.closeMenu(),
      toggleMobile: () => this.toggleMobile(),
    };
  }
}
</script>
</body>
</html>
